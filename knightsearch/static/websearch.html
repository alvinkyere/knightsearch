<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knight Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="./static/style.css">
    <meta name="google-site-verification" content="58--tVbjR_StI8qJG5UJap4L8Ct0d0mw3PRsnm01Nfk" />
</head>

<body>
    <main class="home">
        <div class="home-center">
            <h1 class="logo"><span class="logo-knight">Knight</span><span class="logo-search">Search</span></h1>

            <form class="search-form" method="post" action="/websearch">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.47 6.47 0 0 0 1.48-5.34c-.47-2.78-2.79-5-5.59-5.34a6.505 6.505 0 0 0-7.27 7.27c.34 2.8 2.56 5.12 5.34 5.59a6.47 6.47 0 0 0 5.34-1.48l.27.28v.79l4.25 4.25c.41.41 1.08.41 1.49 0 .41-.41.41-1.08 0-1.49L15.5 14zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <input type="text" placeholder="Search Calvin University..." name="query" autocomplete="off" autofocus>
                </div>
                <div class="search-actions">
                    <button type="submit" class="btn">Search</button>
                </div>
            </form>
        </div>

        {% if recent %}
        <section class="recent-section">
            <h2 class="recent-heading">Relevant to you</h2>
            <div class="recent-grid">
                {% for page in recent %}
                <a class="recent-card" href="{{ page.url }}">
                    <div class="recent-card-source">
                        <img class="favicon" src="https://www.google.com/s2/favicons?sz=32&domain_url={{ page.url }}" alt="" onerror="this.style.display='none';">
                        <span class="recent-card-domain">{{ page.domain }}</span>
                    </div>
                    <h3 class="recent-card-title">{{ page.title }}</h3>
                </a>
                {% endfor %}
            </div>
        </section>
        {% endif %}
    </main>
</body>
</html>
